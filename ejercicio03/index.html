<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const NUMEROSECRETO = 5;
        let numeroUsuario;

        numeroUsuario = Number(prompt("Introduce un número del 1 al 10"));

        if (numeroUsuario === NUMEROSECRETO) {
            alert("Acertaste el numero felicidades")
        } else { alert("No acertaste el numero sigue intentando") }
    </script>

</body>
